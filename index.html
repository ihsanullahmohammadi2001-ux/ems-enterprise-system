<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>EMS Enterprise System</title>
<style>
:root{--navy:#111c2e;--primary:#087f8c;--bg:#f3f6fb;--white:#fff;--text:#263548;--muted:#8190a3;--border:#e5eaf0;--red:#d94f59;--green:#15966a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.login-page{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{background:white;padding:28px;border-radius:16px;width:420px;max-width:100%;box-shadow:0 10px 40px #172b4418}
.login-box h1{font-size:23px;margin-bottom:8px}.login-box p{color:var(--muted);font-size:13px;margin-bottom:22px}
.login-box input{width:100%;padding:13px;border:1px solid var(--border);border-radius:8px;margin:7px 0 14px}
.sidebar{position:fixed;right:0;top:0;bottom:0;width:245px;background:var(--navy);color:white;padding:18px 12px;overflow:auto;z-index:30}
.brand{padding:8px 10px 25px;display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#10b5aa,#087f8c);display:grid;place-items:center;font-size:23px;font-weight:bold}
.brand small{display:block;color:#9baabd;font-size:10px;margin-top:4px}
.menu-title{font-size:10px;color:#7f91a8;padding:10px}
.nav{display:flex;gap:11px;align-items:center;padding:11px;border-radius:8px;margin:3px 0;color:#bdc9d8;font-size:13px;cursor:pointer}
.nav:hover,.nav.active{background:var(--primary);color:white}
.nav b{width:22px;text-align:center}
.main{margin-right:245px;min-height:100vh}
.topbar{height:65px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:15}
.topbar h3{font-size:16px}.topbar small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.top-actions{display:flex;align-items:center;gap:8px}
.lang{padding:9px;border:1px solid var(--border);border-radius:8px;background:white}
.content{padding:22px;max-width:1500px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:22px;margin-bottom:6px}.page-head p{font-size:12px;color:var(--muted)}
.btn{border:0;background:var(--primary);color:white;padding:11px 15px;border-radius:8px;font-size:12px}
.btn.gray{background:#e9eef4;color:#344054}.btn.red{background:#fff0f0;color:#c43e3e}
.btn.green{background:#e5f7ef;color:#087a50}.btn.small{padding:7px 10px;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat,.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:15px}
.stat p{font-size:12px;color:var(--muted);margin:10px 0}.stat h2{font-size:19px;overflow-wrap:anywhere}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.panel-head h3{font-size:15px}
.search{border:1px solid var(--border);padding:10px;border-radius:8px;width:210px;max-width:100%}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{background:#f7f9fc;color:#718096;font-size:11px;text-align:start;padding:12px}
td{font-size:12px;padding:11px;border-bottom:1px solid #edf0f4}
.empty{text-align:center;color:#8995a5;padding:22px}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;margin-bottom:7px;color:#586579}
.field input,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;background:white}
.modal-bg{position:fixed;inset:0;background:#10182799;display:none;align-items:center;justify-content:center;padding:15px;z-index:100}
.modal{background:white;border-radius:14px;padding:22px;width:560px;max-width:100%;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.notice{background:#eaf7f7;color:#08747d;padding:12px;border-radius:8px;font-size:12px;margin-bottom:14px}
.report-line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.status{padding:4px 8px;border-radius:20px;font-size:10px;background:#e5f7ef;color:#087a50}
.status.cancelled{background:#fff0f0;color:#bd3434}
.mobile-menu{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
.sidebar{width:260px;transform:translateX(100%);transition:.2s}
.sidebar.open{transform:translateX(0)}
.main{margin-right:0}.topbar{height:60px;padding:0 12px}
.content{padding:15px 11px 85px}
.mobile-menu{display:block;border:0;padding:8px 11px;border-radius:8px;background:#eaf2f4}
.form-grid{grid-template-columns:1fr}.search{width:100%}
.bottom-nav{display:flex!important;position:fixed;bottom:0;right:0;left:0;background:white;border-top:1px solid var(--border);justify-content:space-around;padding:8px 0;z-index:20}
.bottom-nav button{border:0;background:none;color:#718096;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottom-nav button span{font-size:18px}.bottom-nav button.active{color:var(--primary)}
}
.bottom-nav{display:none}
</style>
</head>

<!-- ADMIN LOGIN -->
<section class="login-page" id="loginPage">
 <div class="login-box">
  <div class="logo">E</div>
  <h1>EMS SYSTEM</h1>
  <p id="loginDescription">د اډمین خوندي ننوتل</p>
  <form id="loginForm">
   <div class="field"><label>Email</label>
    <input id="loginEmail" type="email" required autocomplete="username" placeholder="Admin Email">
   </div>
   <div class="field"><label>Password</label>
    <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Password">
   </div>
   <button class="btn" style="width:100%;margin-top:8px" type="submit" id="loginButton">Login</button>
  </form>
  <p id="loginMessage" style="margin-top:14px;color:#c43e3e"></p>
 </div>
</section>

<div id="app" class="hidden">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">E</div><div><h2>EMS SYSTEM</h2><small>Enterprise Management</small></div></div>
 <div class="menu-title" id="menuTitle"></div>
 <nav id="navigation"></nav>
 <div style="border-top:1px solid #ffffff20;margin-top:18px;padding:15px 8px;color:#8fa0b5;font-size:10px">
  EMS 4.0 · AFN
  <button class="btn red small" style="display:block;margin-top:12px" onclick="logout()">Logout</button>
 </div>
</aside>
<main class="main">
 <header class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
   <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
   <div><h3 id="topTitle"></h3><small id="today"></small></div>
  </div>
  <div class="top-actions">
   <select class="lang" id="language" onchange="changeLanguage(this.value)">
    <option value="ps">پښتو</option><option value="fa">دری</option><option value="en">English</option>
   </select>
   <div id="syncStatus" style="font-size:10px;color:#15966a">● Online</div>
  </div>
 </header>
 <div class="content" id="content"></div>
</main>
<nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
 <div class="modal">
  <div class="modal-head"><h3 id="modalTitle"></h3><button class="btn gray small" onclick="closeModal()">✕</button></div>
  <form id="recordForm">
   <div class="form-grid" id="formFields"></div>
   <div class="modal-actions">
    <button type="button" class="btn gray" onclick="closeModal()" id="cancelButton">Cancel</button>
    <button type="submit" class="btn" id="saveButton">Save</button>
   </div>
  </form>
 </div>
</div>

function t(k){return L[lang][k]||L.en[k]||k}
function uid(){return "E"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Number(n||0).toLocaleString(lang==="en"?"en-US":"fa-IR",{maximumFractionDigits:2})+" AFN"}
function today(){return new Date().toLocaleDateString(lang==="en"?"en-GB":"fa-IR")}
function sum(a,k){return a.reduce((s,x)=>s+Number(x[k]||0),0)}
function activeRows(type){return (db[type]||[]).filter(x=>x.status!=="cancelled")}
function setSync(msg,color){let e=document.getElementById("syncStatus");e.textContent=msg;e.style.color=color||"#15966a"}

document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();

 button.disabled=true;button.textContent="...";

auth.onAuthStateChanged(async user=>{
 if(!user){
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  return;
 }
 if((user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
  await auth.signOut();alert(t("notAdmin"));return;
 }
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 await loadCloud();
});
async function logout(){await auth.signOut()}
async function loadCloud(){
 setSync(t("syncing"),"#b7791f");
 try{
  const snap=await DATA_REF.get();
  if(snap.exists){
   const data=snap.data();
   Object.keys(defaults).forEach(k=>db[k]=Array.isArray(data[k])?data[k]:[]);
   localStorage.setItem("EMS_DATA",JSON.stringify(db));
  }else{
   try{
    const old=JSON.parse(localStorage.getItem("EMS_DATA")||"{}");
    Object.keys(defaults).forEach(k=>db[k]=Array.isArray(old[k])?old[k]:[]);
   }catch(e){}
   await DATA_REF.set(db);
  }
  cloudReady=true;
  renderAll();setSync(t("synced"),"#15966a");
 }catch(e){
  setSync(t("syncError"),"#d94f59");
  alert("Firestore: "+e.message);
 }
}
async function save(){
 localStorage.setItem("EMS_DATA",JSON.stringify(db));
 if(!cloudReady)return;
 setSync(t("syncing"),"#b7791f");
 try{
  await DATA_REF.set(db);
  setSync(t("synced"),"#15966a");
 }catch(e){
  setSync(t("syncError"),"#d94f59");
  alert("Firebase error: "+e.message);
 }
}

function head(title,desc,button=""){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function stat(title,value,icon){return `<div class="stat"><div>${icon}</div><p>${title}</p><h2>${value}</h2></div>`}

 return head(t("company"),t("overview"))+

 ${stat(t("totalProducts"),db.products.length,"▣")}
 ${stat(t("totalCustomers"),db.customers.length,"♧")}
 ${stat(t("totalEmployees"),db.employees.length,"♙")}

 ${stat(t("totalPurchases"),money(purchases),"🛒")}

function simpleTable(rows,keys){
 if(!rows.length)return `<div class="empty">${t("noData")}</div>`;
 return `<div class="table-wrap"><table><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${k==="total"?money(r[k]):esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function lowStock(){

/* SAVE RECORDS */
document.getElementById("recordForm").addEventListener("submit",async function(e){
 e.preventDefault();
 const v=Object.fromEntries(new FormData(this).entries());
 if(formType==="sales"||formType==="purchases"){
  const sale=formType==="sales",list=sale?db.customers:db.suppliers;
  const party=list.find(x=>String(x.id)===String(v.partyId));
  const product=db.products.find(x=>String(x.id)===String(v.productId));
  if(!party){alert(t(sale?"chooseCustomer":"chooseSupplier"));return}
  if(!product){alert(t("chooseProduct"));return}
  const qty=Number(v.quantity),price=Number(v.price),paid=Number(v.paid||0),total=qty*price;
  if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0||!Number.isFinite(paid)||paid<0||paid>total){alert(t("invalid"));return}
  if(sale&&qty>Number(product.quantity||0)){alert(t("noStock"));return}
  product.quantity=Number(product.quantity||0)+(sale?-qty:qty);
  db[formType].push({id:uid(),date:today(),party:party.name,partyId:party.id,productName:product.name,productId:product.id,quantity:qty,price,total,paid,due:total-paid,method:v.method,status:"active"});
 }else if(formType==="payments"){
  let amount=Number(v.amount);if(!Number.isFinite(amount)||amount<=0){alert(t("invalid"));return}
  db.payments.push({id:uid(),date:today(),...v,amount,status:"active"});
 }else{
  let obj={...v,id:editing===null?uid():db[formType][editing].id};
  if(formType==="products")["purchasePrice","sellingPrice","quantity","minStock"].forEach(k=>obj[k]=Number(obj[k]||0));
  if(formType==="expenses")obj.amount=Number(obj.amount||0);
  if(formType==="accounts")obj.balance=Number(obj.balance||0);
  if(editing===null)db[formType].push(obj);else db[formType][editing]=obj;
 }
 await save();closeModal();render();alert(t("success"));
});

/* FINANCIAL CANCELLATION: ADMIN PASSWORD RECHECK */
async function verifyAdminPassword(){
 const password=prompt(t("passwordAgain"));
 if(password===null)return false;
 try{
  const user=auth.currentUser;
  const credential=firebase.auth.EmailAuthProvider.credential(user.email,password);
  await user.reauthenticateWithCredential(credential);
  return true;
 }catch(e){alert(t("wrongPassword"));return false}
}
async function cancelFinancial(type,id){
 if(!["sales","purchases","payments"].includes(type))return;
 const record=db[type].find(x=>x.id===id);
 if(!record||record.status==="cancelled")return;
 const reason=prompt(t("askReason"));
 if(reason===null)return;
 if(!reason.trim()){alert(t("reasonRequired"));return}
 if(!confirm(t("confirmCancel")))return;
 if(!await verifyAdminPassword())return;

 if(type==="sales"||type==="purchases"){
  const product=db.products.find(p=>p.id===record.productId);
  if(product){
   product.quantity=Number(product.quantity||0)+(type==="sales"?Number(record.quantity||0):-Number(record.quantity||0));
  }
 }
 record.status="cancelled";
 record.cancelReason=reason.trim();
 record.cancelledAt=new Date().toISOString();
 record.cancelledBy=auth.currentUser.email;
 db.auditLogs.push({id:uid(),action:"CANCEL",recordType:type,recordId:id,reason:reason.trim(),date:new Date().toISOString(),user:auth.currentUser.email});
 await save();render();alert(t("cancelled"));
}
async function restoreFinancial(type,id){
 const record=db[type].find(x=>x.id===id);
 if(!record||record.status!=="cancelled")return;
 if(!confirm(t("restoreConfirm")))return;
 if(!await verifyAdminPassword())return;
 if(type==="sales"||type==="purchases"){
  const product=db.products.find(p=>p.id===record.productId);
  if(product){
   const change=type==="sales"?-Number(record.quantity||0):Number(record.quantity||0);
   if(type==="sales"&&Number(product.quantity||0)<Number(record.quantity||0)){alert(t("noStock"));return}
   product.quantity=Number(product.quantity||0)+change;
  }
 }
 record.status="active";
 record.restoredAt=new Date().toISOString();
 record.restoredBy=auth.currentUser.email;
 db.auditLogs.push({id:uid(),action:"RESTORE",recordType:type,recordId:id,date:new Date().toISOString(),user:auth.currentUser.email});
 await save();render();alert(t("success"));
}

function backup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="EMS-Backup.json";a.click();URL.revokeObjectURL(a.href);
}
function restoreBackup(input){
 const file=input.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=async()=>{
  try{
   const data=JSON.parse(reader.result);
   Object.keys(defaults).forEach(k=>db[k]=Array.isArray(data[k])?data[k]:[]);
   await save();renderAll();alert(t("restoreDone"));
  }catch(e){alert(t("restoreError"))}
 };
